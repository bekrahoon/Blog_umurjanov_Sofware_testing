<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
</head>
<body>
    <h1>{{ product.name }}</h1>
    <p>{{ product.description }}</p>
    <p>Цена: {{ product.price }} сом</p>
    <p>Количество: {{ product.quantity }}</p>
    <p>Создан: {{ product.created_at }}</p>
    <a href="{% url 'product_update' product.id %}">Изменить</a>
    | <a href="{% url 'product_delete' product.id %}">Удалить</a>
    | <a href="{% url 'product_list' %}">Назад к списку</a>
</body>
</html>
