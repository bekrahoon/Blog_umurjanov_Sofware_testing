<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление</title>
</head>
<body>
    <h1>Удалить «{{ product.name }}»?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
    </form>
    <a href="{% url 'product_detail' product.id %}">Отмена</a>
</body>
</html>
